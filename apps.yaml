# Promoted platform apps. Each has its own repo made from promo-app-template.
# The app's namespace is its name. dependsOn names other apps or the platform
# Kustomizations `canary`, `guardrails` and `testkube` in this repo.
apps:
  - name: kyverno
    repo: promo-kyverno
    dependsOn: [testkube]
  - name: kyverno-policies
    repo: promo-kyverno-policies
    dependsOn: [kyverno, testkube]
  - name: prometheus
    repo: promo-prometheus
    dependsOn: [kyverno, canary, testkube]
  - name: otel-collector
    repo: promo-otel-collector
    dependsOn: [kyverno, testkube]
