kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tier-stg
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      # /tmp is tmpfs inside kind nodes; etcd there avoids fsync stalls on the
      # shared Docker disk (LESSONS #17). Cluster state dies with the node.
      - |
        kind: ClusterConfiguration
        etcd:
          local:
            dataDir: /tmp/etcd
