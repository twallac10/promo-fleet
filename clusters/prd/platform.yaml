# Platform pieces from this repo that are not promoted: guardrails and canary.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: guardrails
  namespace: flux-system
spec:
  interval: 10m
  path: ./guardrails
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: app-kyverno
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: canary
  namespace: flux-system
spec:
  interval: 10m
  path: ./canary
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Testkube: behaviour tests for every app (the evidence the gate verifies).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: testkube
  namespace: flux-system
spec:
  interval: 10m
  path: ./testkube
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# promo-report, the shared last step of behaviour TestWorkflows. A Testkube kind,
# so it is applied after testkube has installed the CRDs. Apps depend on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: testkube-report
  namespace: flux-system
spec:
  interval: 10m
  path: ./testkube/report
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: testkube
